name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests JavaScript (moteur, dont l'équivalence avec la v0.1)
        run: npm run test:complet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils Python
        run: pip install pytest ruff matplotlib
      - name: Lint Python
        run: ruff check analyse tests
      - name: Tests Python (modele analytique)
        run: pytest -q tests
